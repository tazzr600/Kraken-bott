name: Replace repository with CloddsBot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: ${{ !contains(github.event.head_commit.message, '[cloddsbot-replace]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace contents with CloddsBot
        run: |
          set -e
          git clone --depth 1 --branch main https://github.com/alsk1992/CloddsBot.git /tmp/CloddsBot
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar --exclude=.git -C /tmp/CloddsBot -cf - . | tar -xf -
          rm -rf /tmp/CloddsBot

      - name: Commit and push replacement
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace bot with CloddsBot [cloddsbot-replace]" || exit 0
          git push --force origin HEAD:main
