name: validate-two-sided-bot
on:
  push:
    branches: ["two-sided-inventory-rebuild"]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile bot.py config.py kraken_client.py market_scanner.py main.py
